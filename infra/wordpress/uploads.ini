; The official wordpress image does not raise PHP upload limits (it only ships
; opcache + error-logging ini files), so the defaults of 2M/8M apply. Legacy PFY
; packages are up to ~14MB, which would fail to upload without this.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 300
